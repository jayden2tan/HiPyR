[project]
name = "HiPyR"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Jayden Tan" }
]
dependencies = [
    "flet>=0.86.5",
    "flet-audio>=0.86.5",
    "mutagen>=1.48.1",
    # you have to manually install libmagic for macOS and linux
    # https://pypi.org/project/python-magic/#:~:text=Installation
    "python-magic>=0.4.27",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'"
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "flet-web>=0.86.5",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
org = "com.jayden2tan.hipyr"
product = "HiPyR"
copyright = "Copyright (C) 2026 by Jayden Tan"

[tool.flet.app]
path = "src"
